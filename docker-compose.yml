version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse_password
      POSTGRES_DB: devpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse -d devpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devpulse-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devpulse-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://devpulse:devpulse_password@postgres:5432/devpulse_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=devpulse-super-secret-production-key-change-in-prod-2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python -m app.db.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devpulse-celery-worker
    restart: always
    environment:
      - DATABASE_URL=postgresql://devpulse:devpulse_password@postgres:5432/devpulse_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    command: celery -A app.tasks.worker worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devpulse-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
